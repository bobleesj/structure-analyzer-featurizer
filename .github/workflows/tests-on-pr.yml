name: Tests on PR

on:
  pull_request:
  workflow_dispatch:

jobs:
  tests-on-pr:
    uses: scikit-package/release-scripts/.github/workflows/_tests-on-pr-no-codecov.yml@v0
    with:
      project: structure-analyzer-featurizer
      c_extension: false
      headless: false
      # cifkit>=1.2.0 is on PyPI; conda-forge may lag. Install from PyPI for CI.
      run: |
        pip install 'cifkit>=1.2.0'
