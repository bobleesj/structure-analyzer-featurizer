name: CI

on:
  push:
    branches:
      - main
  release:
    types:
      - prereleased
      - published
  workflow_dispatch:

jobs:
  matrix-coverage:
    uses: scikit-package/release-scripts/.github/workflows/_matrix-no-codecov-on-merge-to-main.yml@v0
    with:
      project: structure-analyzer-featurizer
      c_extension: false
      headless: false
      run: |
        pip install 'cifkit>=1.2.0'
