name: CI

on:
  push:
    branches:
      - main
  release:
    types:
      - prereleased
      - published
  workflow_dispatch:

jobs:
  matrix-coverage:
    uses: scikit-package/release-scripts/.github/workflows/_matrix-and-codecov-on-merge-to-main.yml@v0
    with:
      project: structure-analyzer-featurizer
      c_extension: false
      headless: false
      # cifkit>=1.2.0 is on PyPI but not yet on conda-forge (latest there is 1.1.1).
      run: |
        pip install 'cifkit>=1.2.0'
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
